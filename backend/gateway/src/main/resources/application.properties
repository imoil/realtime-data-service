spring.application.name=realtime-telemetry-gateway
server.port=8080
server.compression.enabled=false

# Enable Virtual Threads (JDK 25)
spring.threads.virtual.enabled=true

# ClickHouse Cluster Live Connection Configuration
telemetry.clickhouse.enabled=false
telemetry.clickhouse.url=http://localhost:8123
telemetry.clickhouse.database=iot
telemetry.clickhouse.user=default
telemetry.clickhouse.password=

# Kafka Live Telemetry Bridge Configuration
telemetry.kafka.enabled=false
telemetry.kafka.bootstrap-servers=localhost:9092
telemetry.kafka.topic=iot.telemetry.raw
telemetry.kafka.group-id=telemetry-gateway-live-tail
spring.kafka.consumer.auto-offset-reset=latest
