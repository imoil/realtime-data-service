spring.application.name=realtime-telemetry-gateway
server.port=8080
server.compression.enabled=false

# Enable Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# ClickHouse Cluster Live Connection Configuration
telemetry.clickhouse.enabled=false
telemetry.clickhouse.url=http://localhost:8123
telemetry.clickhouse.database=iot
telemetry.clickhouse.user=default
telemetry.clickhouse.password=
