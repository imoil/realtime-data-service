services:
  # ---------------------------------------------------------------------------
  # 1. Apache Kafka 3.8 (KRaft Mode - Zero Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: telemetry-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Automatic topic initialization for 128 partitions
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: telemetry-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/sh -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.telemetry.raw --partitions 128 --replication-factor 1
        echo 'Kafka topic iot.telemetry.raw initialized with 128 partitions.'
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # 2. ClickHouse Server 24.8 LTS
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: telemetry-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: iot
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./backend/gateway/src/main/resources/db/migration/V1__init_telemetry_tables.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 3. MinIO S3 Object Storage & Bucket Initializer
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: telemetry-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: telemetry-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb local/telemetry-warehouse || true;
        echo 'MinIO bucket telemetry-warehouse initialized.';
        exit 0;
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # 4. Apache Flink 1.20 (JobManager & TaskManager)
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.20-java17
    container_name: telemetry-flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 4
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 10

  flink-taskmanager:
    image: flink:1.20-java17
    container_name: telemetry-flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 4

  # ---------------------------------------------------------------------------
  # 5. Spring Boot Gateway (Java 21 Virtual Threads & Direct Arrow Stream)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: telemetry-gateway
    hostname: gateway
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEMETRY_CLICKHOUSE_URL: http://clickhouse:8123
      TELEMETRY_CLICKHOUSE_DATABASE: iot
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      TELEMETRY_STORAGE_MODE: live
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || wget -q -O - http://localhost:8080/api/v1/telemetry/am4-arrow?sensorId=1&range=1h&resolution=1m || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 6. Vite Vue 3 Dashboard Frontend (Nginx Reverse Proxy)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telemetry-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway
    restart: unless-stopped
